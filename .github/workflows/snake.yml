name: Generate contribution snake

on:
  schedule:
    # 03:17 UTC daily — off the hour so it isn't queued with everyone else's cron
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

# Only one run at a time; a newer run cancels an in-flight one.
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2C5364
            dist/snake-dark.svg?palette=github-dark&color_snake=#5EEAD4

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
